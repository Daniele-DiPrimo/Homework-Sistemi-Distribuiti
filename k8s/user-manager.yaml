# --- User Manager ---
apiVersion: v1
kind: Service
metadata:
  name: user-manager
spec:
  ports:
  - port: 5000
  selector:
    app: user-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-manager
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-manager
  template:
    metadata:
      labels:
        app: user-manager
      annotations: 
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: user-manager
        image: local/user-manager:v1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: secret-vol
          mountPath: "/secrets"
          readOnly: true
        # LIVENESS: Riavvia se incastrato per 15 secondi (3 tentativi * 5s)
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # READINESS: Isola se lento per 10 secondi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway # Se non c'è spazio, ammassali pur di partire
          labelSelector:
            matchLabels:
              app: user-manager
      volumes:
      - name: secret-vol
        secret:
          secretName: app-secrets
          items:
          - key: private_key.pem
            path: private_key.pem