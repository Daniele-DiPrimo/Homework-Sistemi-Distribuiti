# --- API Gateway ---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
  - name: https
    port: 443
    targetPort: 443
    nodePort: 30443
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: gateway
        image: local/api-gateway:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: keys-volume
          mountPath: /etc/nginx/keys
          readOnly: true
        - name: ssl-volume
          mountPath: /etc/nginx/ssl
          readOnly: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway 
          labelSelector:
            matchLabels:
              app: api-gateway
      volumes:
      - name: keys-volume
        secret:
          secretName: app-secrets
          items:
          - key: public_key.pem
            path: public.pem
      - name: ssl-volume
        secret:
          secretName: app-secrets
          items:
          - key: nginx.crt
            path: nginx.crt
          - key: nginx.key
            path: nginx.key