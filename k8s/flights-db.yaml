# --- Flights DB ---
apiVersion: v1
kind: Service
metadata:
  name: flights-db
spec:
  ports:
  - port: 3306
  selector:
    app: flights-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flights-db
spec:
  serviceName: "flights-db"
  replicas: 1
  selector:
    matchLabels:
      app: flights-db
  template:
    metadata:
      labels:
        app: flights-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        imagePullPolicy: IfNotPresent
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: app-secrets, key: FLIGHTSDB_ROOT_PASSWORD } }
        - name: MARIADB_USER
          valueFrom: { configMapKeyRef: { name: app-config, key: FLIGHTSDB_USER } }
        - name: MARIADB_PASSWORD
          valueFrom: { secretKeyRef: { name: app-secrets, key: FLIGHTSDB_PASSWORD } }
        - name: MARIADB_DATABASE
          valueFrom: { configMapKeyRef: { name: app-config, key: FLIGHTSDB_DATABASE } }
        volumeMounts:
        - name: flightdb-data
          mountPath: /var/lib/mysql
        readinessProbe:
          exec:
            command: ["sh", "-c", "mariadb-admin ping -h localhost -u root -p$MARIADB_ROOT_PASSWORD"]
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 10
  volumeClaimTemplates:
  - metadata:
      name: flightdb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources: { requests: { storage: 1Gi } }