# --- Data Collector ---
apiVersion: v1
kind: Service
metadata:
  name: data-collector
spec:
  ports:
  - name: http
    port: 5000
    targetPort: 5000
  - name: grpc
    port: 50051
    targetPort: 50051
  selector:
    app: data-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-collector
  template:
    metadata:
      labels:
        app: data-collector
      annotations: 
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: data-collector
        image: local/data-collector:v1
        imagePullPolicy: Never
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: secret-vol
          mountPath: "/secrets"
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 50051 # Controlla la porta gRPC
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: secret-vol
        secret:
          secretName: app-secrets
          items:
          - key: credentials.json
            path: credentials.json