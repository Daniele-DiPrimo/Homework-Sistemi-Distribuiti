# --- Data Collector ---
apiVersion: v1
kind: Service
metadata:
  name: data-collector
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 5000
    targetPort: 5000
  selector:
    app: data-collector
---
apiVersion: v1
kind: Service
metadata:
  name: data-collector-headless
spec:
  clusterIP: None
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
  selector:
    app: data-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-collector
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-collector
  template:
    metadata:
      labels:
        app: data-collector
      annotations: 
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: data-collector
        image: local/data-collector:v1
        imagePullPolicy: Never
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: secret-vol
          mountPath: "/secrets"
          readOnly: true
        # LIVENESS: Riavvia se incastrato per 15 secondi (3 tentativi * 5s)
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # READINESS: Isola se lento per 10 secondi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      volumes:
      - name: secret-vol
        secret:
          secretName: app-secrets
          items:
          - key: credentials.json
            path: credentials.json