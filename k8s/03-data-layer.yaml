# --- Flights DB ---
apiVersion: v1
kind: Service
metadata:
  name: flights-db
spec:
  ports:
  - port: 3306
  selector:
    app: flights-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flights-db
spec:
  serviceName: "flights-db"
  replicas: 1
  selector:
    matchLabels:
      app: flights-db
  template:
    metadata:
      labels:
        app: flights-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        # PASSWORD DI ROOT
        - name: MARIADB_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: app-secrets, key: FLIGHTSDB_ROOT_PASSWORD } }
        # UTENTE DA CREARE (Fix: prende dal Secret)
        - name: MARIADB_USER
          valueFrom: { secretKeyRef: { name: app-secrets, key: FLIGHTSDB_USER } }
        # PASSWORD UTENTE (Fix: prende dal Secret)
        - name: MARIADB_PASSWORD
          valueFrom: { secretKeyRef: { name: app-secrets, key: FLIGHTSDB_PASSWORD } }
        # DATABASE DA CREARE
        - name: MARIADB_DATABASE
          valueFrom: { secretKeyRef: { name: app-secrets, key: FLIGHTSDB_DATABASE } }
        volumeMounts:
        - name: flightdb-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: flightdb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources: { requests: { storage: 1Gi } }

# --- User DB ---
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
spec:
  ports:
  - port: 3306
  selector:
    app: user-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-db
spec:
  serviceName: "user-db"
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: app-secrets, key: MARIADB_ROOT_PASSWORD } }
        - name: MARIADB_USER
          valueFrom: { secretKeyRef: { name: app-secrets, key: USER_DB } }
        - name: MARIADB_PASSWORD
          valueFrom: { secretKeyRef: { name: app-secrets, key: PASSWORD_DB } }
        - name: MARIADB_DATABASE
          valueFrom: { secretKeyRef: { name: app-secrets, key: NAME_DB } }
        volumeMounts:
        - name: userdb-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: userdb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources: { requests: { storage: 1Gi } }

# --- Redis Caches ---
---
apiVersion: v1
kind: Service
metadata:
  name: data-cache
spec:
  ports:
  - port: 6379
  selector:
    app: data-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-cache
  template:
    metadata:
      labels:
        app: data-cache
    spec:
      containers:
      - name: redis
        image: redis:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: user-cache
spec:
  ports:
  - port: 6379
  selector:
    app: user-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-cache
  template:
    metadata:
      labels:
        app: user-cache
    spec:
      containers:
      - name: redis
        image: redis:alpine