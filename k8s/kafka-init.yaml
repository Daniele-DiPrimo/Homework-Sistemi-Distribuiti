apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: confluentinc/cp-kafka:7.4.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args: # Kafka Topic Creation Script
          - |
            # Define Bootstrap Servers
            BOOTSTRAP="kafka-0.kafka-headless.default.svc.cluster.local:9092,kafka-1.kafka-headless.default.svc.cluster.local:9092,kafka-2.kafka-headless.default.svc.cluster.local:9092"
            
            echo "Bootstrap Servers: $BOOTSTRAP"
            echo "Waiting for Kafka to be reachable..."

            # 2. Wait until Kafka is reachable
            until kafka-topics --bootstrap-server $BOOTSTRAP --list; do
              echo "Kafka connection failed/timed out. Retrying in 5 seconds..."
              sleep 5
            done

            echo "SUCCESS: Kafka is reachable! Creating topics..."

            kafka-topics --bootstrap-server $BOOTSTRAP --create --if-not-exists --topic to-alert-system --replication-factor 3 --partitions 3
            kafka-topics --bootstrap-server $BOOTSTRAP --create --if-not-exists --topic to-notify --replication-factor 3 --partitions 3
            
            echo "Done. Topics created."