kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
# --- NODO DI CONTROLLO (Master) ---
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Espone SOLO l'API Gateway (Nginx)
  - containerPort: 30080
    hostPort: 80
    protocol: TCP
  - containerPort: 30443
    hostPort: 443
    protocol: TCP

# --- NODI WORKER (Per distribuire il carico) ---
- role: worker
- role: worker
- role: worker