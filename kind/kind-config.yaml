kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 80      # Gateway HTTP
    protocol: TCP
  - containerPort: 30443
    hostPort: 443     # Gateway HTTPS
    protocol: TCP
  - containerPort: 30081
    hostPort: 8080    # Kafka UI
    protocol: TCP