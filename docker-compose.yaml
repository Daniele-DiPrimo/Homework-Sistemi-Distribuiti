services:

  broker-kafka: 
    image: apache/kafka:3.7.1
    container_name: broker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: "-Xmx400M -Xms400M"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    

  kafka-ui: 
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - broker-kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker-kafka:9092



  api_gateway:
    image: nginx:latest
    container_name: api_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Montiamo il file di config nella cartella di default di NGINX
      - ./api_gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Montiamo il file di config del load_balancer
      - ./api_gateway/load_balancer.conf:/etc/nginx/conf.d/load_balancer.conf:ro
      # Montiamo la cartella coi certificati
      - ./api_gateway/SSL:/etc/nginx/ssl:ro
    depends_on:
      - user-manager
      - data-collector
    networks:
      - user-network
      - data-network

  flights_db:
    image: mariadb:10.11
    container_name: flights_db
    ports:
    - "${FLIGHTSDB_HOST_PORT}:${FLIGHTSDB_PORT}"
    environment:
      - MARIADB_DATABASE=${FLIGHTSDB_DATABASE}
      - MARIADB_USER=${FLIGHTSDB_USER}
      - MARIADB_PASSWORD=${FLIGHTSDB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${FLIGHTSDB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 120s
    networks:
      - data-network
    restart: on-failure
    volumes:
      - flightdb_data:/var/lib/mysql

  data-collector:
    build: ./data_collector
    container_name: data-collector
    #ports:
    #  - "${DATA_COLLECTOR_HOST_PORT}:${DATA_COLLECTOR_PORT}"
    expose:
      - "5001"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_COLLECTOR_PORT=${DATA_COLLECTOR_PORT}
      - FLIGHTSDB_PORT=${FLIGHTSDB_PORT}
      - FLIGHTSDB_DATABASE=${FLIGHTSDB_DATABASE}
      - FLIGHTSDB_USER=${FLIGHTSDB_USER}
      - FLIGHTSDB_PASSWORD=${FLIGHTSDB_PASSWORD}
      - FLIGHTSDB_HOST=${FLIGHTSDB_HOST}
      - SECRETS_PATH=${SECRETS_PATH}
      - REDIST_HOST=${DATA_REDIS_HOST}
      - REDIST_PORT=${REDIS_PORT}
    secrets:
      - opensky_secrets
    depends_on:
      flights_db: 
        condition: service_healthy
      data-cache:
          condition: service_healthy
    networks:
      - data-network
      - intra-network
    restart: on-failure

  data-cache: 
    image: redis:alpine
    container_name: data-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - data-network
    ports:
      - "${DATA_REDIS_HOST_PORT}:${REDIS_PORT}"

  user-db: 
    image: mariadb:10.11
    container_name: user-db
    restart: always 
    environment:
      - MARIADB_ROOT_PASSWORD=${PASSWORD_ROOT_DB}
      - MARIADB_DATABASE=${NAME_DB}
      - MARIADB_USER=${USER_DB}
      - MARIADB_PASSWORD=${PASSWORD_DB}
    ports:
      - "${USER_DB_HOST_PORT}:${USER_DB_PORT}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 120s
    networks:
      - user-network
    volumes: 
      - userdb_data:/var/lib/mysql


  user-manager:
    build: ./user_manager
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    restart: always
    #ports:
    #  - "${USER_MANAGER_HOST_PORT}:${USER_MANAGER_PORT}"
    expose:
      - "5000"
    environment:
      - PYTHONUNBUFFERED= 1
      - HOST_DB=${HOST_DB}
      - USER_DB=${USER_DB}
      - PASSWORD_DB=${PASSWORD_DB}
      - NAME_DB=${NAME_DB}
      - USER_DB_PORT=${USER_DB_PORT}
      - REDIST_HOST=${USER_REDIS_HOST}
      - REDIST_PORT=${REDIS_PORT}
    depends_on:
      user-db:
          condition: service_healthy
      user-cache:
          condition: service_healthy
    networks:
      - user-network
      - intra-network
  
  user-cache: 
    image: redis:alpine
    container_name: user-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - user-network
    ports:
      - "${USER_REDIS_HOST_PORT}:${REDIS_PORT}"

volumes:
  flightdb_data:
  userdb_data:
  kafka_data:

networks:
  user-network:
  data-network:
  intra-network:

secrets:
  opensky_secrets:
    file: "./data_collector/credentials.json"
