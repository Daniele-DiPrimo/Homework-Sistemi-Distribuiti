syntax = "proto3"; 

// questo e' il file .proto in cui si definiscono le funzioni
// che permettono la comunicazione tra i due microservizi. 

service DeleteUserInterestsService{
    rpc DeleteUserInterests (DeleteUserInterestsRequest) returns (DeleteUserInterestsResponse);
}

message DeleteUserInterestsRequest{
    string email = 1; 
}

message DeleteUserInterestsResponse{
    int32 status = 1; //status code: 0 = success, 1 = error ; status = ...
    string message = 2; 
}