# 1. Configurazione Globale (Fuori da http)
worker_processes 1;

# 2. SEZIONE EVENTS (OBBLIGATORIA - Era questa che mancava!)
events {
    # Indica quante connessioni simultanee può gestire ogni worker
    worker_connections 1024;
}

http {

    # ---------------------------------------------------------------------
    # CACHE PER LA CHIAVE PUBBLICA
    # ---------------------------------------------------------------------
    lua_shared_dict jwt_keys 1m;

    # Blocco di inizializzazione: eseguito 1 volta sola all'avvio del container
    init_by_lua_block {
        local f = io.open("/etc/nginx/keys/public.pem", "rb")
        if f then
            local content = f:read("*all")
            f:close()
            ngx.shared.jwt_keys:set("public_key", content)
        else
            -- Se non trova la chiave, stampa un errore nei log di NGINX
            ngx.log(ngx.ERR, "Impossibile caricare /etc/nginx/keys/public.pem")
        end
    }

    server {
        # Ascolta sulla porta sicura 443
        listen 443 ssl;
        
        # FIX AVVISO HTTP2: Aggiunto direttiva esplicita
        http2 on;

            # ---------------------------------------------------------------------
        # 1. IL DIZIONARIO DEI FILE
        # ---------------------------------------------------------------------
        # Carica un file esterno che mappa le estensioni (es. .html, .json, .jpg)
        # ai tipi di contenuto corretti. Senza questo, il browser non sa se
        # sta ricevendo un testo, un'immagine o un video.
        include       mime.types;

        # ---------------------------------------------------------------------
        # 2. IL PIANO B (Paracadute)
        # ---------------------------------------------------------------------
        # Se NGINX riceve un file che non è nel dizionario 'mime.types' (vedi sopra),
        # questa riga dice: "Trattalo come un flusso di byte generico".
        # In pratica, forza il browser a fare "Scarica" invece di provare ad aprirlo
        # e mostrare caratteri incomprensibili.
        default_type  application/octet-stream;
        
        # ---------------------------------------------------------------------
        # 3. LA SCATOLA NERA (Logging)
        # ---------------------------------------------------------------------
        # Registra ogni singola richiesta (chi, quando, cosa, status code).
        # Fondamentale per vedere se le API vengono chiamate e da chi.
        access_log /usr/local/openresty/nginx/logs/access.log;
        
        # Registra solo quando le cose vanno male (errori Lua, crash, config errata).
        # È il primo file da guardare se il container non parte o le API danno 500.
        error_log  /usr/local/openresty/nginx/logs/error.log;

        # ---------------------------------------------------------------------
        # 4. IL TURBO (Performance)
        # ---------------------------------------------------------------------
        # Abilita la copia "Zero-Copy" a livello di Kernel.
        # Invece di fare: Disco -> RAM Nginx -> Scheda di Rete (lento),
        # fa direttamente: Disco -> Scheda di Rete.
        # Risparmia CPU e rende il trasferimento file/dati molto più veloce.
        sendfile        on;

        # ---------------------------------------------------------------------
        # 5. EFFICIENZA CONNESSIONI
        # ---------------------------------------------------------------------
        # Dice a NGINX: "Non chiudere la connessione TCP appena hai risposto".
        # La tiene viva per 65 secondi. Se il frontend fa 10 chiamate API di fila,
        # usa sempre lo stesso "tubo" già aperto, risparmiando il tempo di 
        # rinegoziazione (handshake) per ogni richiesta.
        keepalive_timeout  65;

        # -----------------------------------------------------------------
        # CONFIGURAZIONE SSL (Certificati)
        # -----------------------------------------------------------------
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        
        # Protocolli sicuri (Opzionale ma consigliato)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # -----------------------------------------------------------
        # FIX DNS DOCKER
        # -----------------------------------------------------------
        # Questo dice a NGINX: "Per risolvere i nomi dei container (come user-cache),
        # chiedi al server DNS interno di Docker (127.0.0.11)".
        #resolver 127.0.0.11 valid=30s ipv6=off;
        resolver local=on ipv6=off;

        # -----------------------------------------------------------------
        # ROTTA 1: LOGIN / REGISTER (PUBBLICA)
        # -----------------------------------------------------------------
        # Qui NON usiamo lo script Lua perché l'utente deve ancora autenticarsi
        location /auth/ {
            #proxy_pass http://user-manager:5000;
            proxy_pass http://user-manager.default.svc.cluster.local:5000;
        }

        # -----------------------------------------------------------------
        # ROTTA 2: DATA COLLECTOR (PROTETTA)
        # -----------------------------------------------------------------
        location /flights/ {
            # 1. Chiama lo script di validazione esterno
            access_by_lua_file /etc/nginx/lua/jwt_validator.lua;

            # 3. Inoltra al microservizio
            #proxy_pass http://data-collector:5000/;
            proxy_pass http://data-collector.default.svc.cluster.local:5000/;
        }

        # -----------------------------------------------------------------
        # ROTTA 3: USERS (PROTETTA)
        # -----------------------------------------------------------------
        location /users/ {
            access_by_lua_file /etc/nginx/lua/jwt_validator.lua;
            
            #proxy_pass http://user-manager:5000;
            proxy_pass http://user-manager.default.svc.cluster.local:5000;
        }
    }
    
    # Redirect automatico da HTTP (80) a HTTPS (443)
    server {
        listen 80; # l'api gateway sara' esposto attraverso la porta 80
        return 308 https://$host$request_uri; # 308 (Permanent Redirect)
    }
}